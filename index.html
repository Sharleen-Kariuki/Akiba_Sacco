<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nokia-Phone (USSD Web Platfor)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="nokia">
        <div id="dots">
            <div class="dot">

            </div>
            <div class="dot">

            </div>
            <div class="dot">

            </div>
            <div class="dot">

            </div>
            <div class="dot">

            </div>
        </div>
        <div id="text">
            NOKIA
        </div>
        <div id="screen">
             <!-- Top Status bar -->
             <div class="screen-header">
                <span><i class="fa-solid fa-signal"></i>3G</span>
                <span><i class="fa-solid fa-signal"></i>2G</span>
                <span><i class="fa-solid fa-battery-full"></i></span>
             </div>

             <!-- Main Menu -->
             <div class="screen-body">
                <h4>Welcome to Akiba School</h4>
             </div>

             <div id="screen-footer">
                <span id="screen-input"></span>
             </div>

        </div>
        <div id="numbers">
            <!-- Top Control Buttons -->
            <div class="row control-row">
                <div class="number text-number btn-call">
                    CALL
                </div>
                <div class="number text-number btn-back">
                    BACK
                </div>
                <div class="number text-number btn-end">
                    END
                </div>
            </div>

            <div class="row">
                <div class="number front-number">
                    1
                </div>
                <div class="number">
                    2
                </div>
                <div class="number back-number">
                    3
                </div>
            </div>
            
            <div class="row">
                <div class="number front-number">
                    4
                </div>
                <div class="number">
                    5
                </div>
                <div class="number back-number">
                    6
                </div>
            </div>
            <div class="row">
                <div class="number front-number">
                    7
                </div>
                <div class="number">
                    8
                </div>
                <div class="number back-number">
                    9
                </div>
            </div>
            <div class="row">
                <div class="number front-number">
                    *
                </div>
                <div class="number">
                    0
                </div>
                <div class="number back-number">
                    #
                </div>
            </div>
        </div>
        
    </div>

    <script type="module" src="./dist/app.js" defer></script>
</body>
</html>
